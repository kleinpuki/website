      else document.body.insertBefore(box,document.body.firstChild);
    }).catch(function(){});
})();</script>

<script id="bernbesse-v9-layout">
(function(){
  const header=document.querySelector('.site-header');
  const nav=document.querySelector('.main-nav');
  if(header && nav && !document.querySelector('.mobile-menu-toggle')){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='mobile-menu-toggle';
    btn.setAttribute('aria-label','Menü öffnen');
    btn.setAttribute('aria-expanded','false');
    btn.innerHTML='<span aria-hidden="true">☰</span>';
    const admin=header.querySelector('.admin-link');
    if(admin) admin.parentNode.insertBefore(btn,admin); else header.querySelector('.header-inner')?.appendChild(btn);
    const close=()=>{nav.classList.remove('mobile-open');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Menü öffnen');btn.innerHTML='<span aria-hidden="true">☰</span>';};
    btn.addEventListener('click',()=>{
      const open=nav.classList.toggle('mobile-open');
      btn.setAttribute('aria-expanded',String(open));
      btn.setAttribute('aria-label',open?'Menü schließen':'Menü öffnen');
      btn.innerHTML='<span aria-hidden="true">'+(open?'×':'☰')+'</span>';
    });
    nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
    window.addEventListener('resize',()=>{if(window.innerWidth>900) close();},{passive:true});
  }
  if(document.documentElement.scrollHeight > window.innerHeight * 1.5 && !document.querySelector('.back-to-top')){
    const b=document.createElement('button');
    b.className='back-to-top'; b.type='button'; b.textContent='Nach oben'; b.setAttribute('aria-label','Nach oben');
    Object.assign(b.style,{position:'fixed',right:'16px',bottom:'16px',zIndex:'900',display:'none',padding:'9px 12px',border:'1px solid var(--line,#2a3339)',borderRadius:'8px',background:'#121814',color:'#e8eee9',cursor:'pointer',fontSize:'12px',boxShadow:'0 8px 24px rgba(0,0,0,.25)'});
    document.body.appendChild(b);
    const update=()=>{b.style.display=window.scrollY>500?'block':'none'};
    window.addEventListener('scroll',update,{passive:true}); update();
    b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  }
})();</script>
